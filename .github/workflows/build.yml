name: build

on:
    push:
        branches:
            - develop
    pull_request:
        branches:
            - develop
            - main
    # A push to main never publishes directly: this workflow re-runs as a
    # reaction to the `tests` workflow completing on main, and publishes
    # only when the suite passed on exactly that commit. A red suite can
    # therefore never ship an image, whatever the trigger.
    workflow_run:
        workflows: [tests]
        branches: [main]
        types: [completed]

permissions:
    contents: read

concurrency:
    group: build-${{ github.event_name }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        timeout-minutes: 30

        # Skip entirely when the triggering test run failed: no point
        # building an image that will never publish.
        if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'

        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  # On workflow_run, build and publish the exact commit
                  # the tests ran on, not the default branch head.
                  ref: ${{ github.event.workflow_run.head_sha || github.sha }}
                  persist-credentials: false

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

            - name: Build the Docker image
              uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
              with:
                  context: .
                  file: container/Containerfile
                  push: false
                  tags: hytale-website:ci
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

    publish:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        needs: [build]
        if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'

        # Only the publishing job may write to the registry: pull
        # request and develop builds get a read-only token.
        permissions:
            contents: read
            packages: write

        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ github.event.workflow_run.head_sha }}
                  persist-credentials: false

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

            - name: Login to GitHub Container Registry
              uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Compute short commit SHA
              # From the checked-out HEAD, not github.sha: on workflow_run
              # the context sha can differ from the tested commit if
              # another push landed in between.
              run: echo "SHORT_SHA=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_ENV"

            - name: Build and publish the Docker image
              uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
              with:
                  context: .
                  file: container/Containerfile
                  push: true
                  tags: |
                      ghcr.io/hytale-assos/website:latest
                      ghcr.io/hytale-assos/website:sha-${{ env.SHORT_SHA }}
                  cache-from: type=gha
